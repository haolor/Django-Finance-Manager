server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_NOTIF_HOST:localhost}:${POSTGRES_NOTIF_PORT:5436}/${POSTGRES_NOTIF_DB:notification_db}
    username: ${POSTGRES_NOTIF_USER:postgres}
    password: ${POSTGRES_NOTIF_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

finance:
  security:
    jwt:
      secret: ${JWT_SECRET:please-change-me-to-a-32-bytes-minimum-secret-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
